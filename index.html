<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hogan Courtyard Phenocam</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h1>Hogan Courtyard Canopy Greenness (GCC)</h1>
    <p>Continuous monitoring of vegetation water stress and phenology.</p>
    <div id="plot-div" style="width:100%; height:500px;"></div>
</div>

<script>
    // Fetch and parse the CSV generated by your Python script
    Papa.parse("phenocam_data.csv", {
        download: true,
        header: true,
        dynamicTyping: true,
        complete: function(results) {
            const data = results.data;
            
            // Extract arrays for X (time) and Y (GCC)
            const timestamps = data.map(row => row.timestamp).filter(t => t != null);
            const gccValues = data.map(row => row.gcc).filter(g => g != null);

            const trace = {
                x: timestamps,
                y: gccValues,
                mode: 'lines+markers',
                type: 'scatter',
                line: { shape: 'spline', color: '#2ca02c' },
                marker: { size: 6 }
            };

            const layout = {
                title: '30-Minute Interval GCC',
                xaxis: { title: 'Time' },
                yaxis: { title: 'Green Chromatic Coordinate (GCC)' },
                hovermode: 'closest'
            };

            Plotly.newPlot('plot-div', [trace], layout);
        }
    });
</script>

</body>
</html>
