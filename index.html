<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hogan Courtyard Phenocam</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 5px; }
        .dashboard-grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .image-card, .plot-card { flex: 1; min-width: 400px; }
        img { width: 100%; border-radius: 4px; border: 1px solid #ddd; }
        .caption { font-size: 0.9em; color: #666; text-align: center; margin-top: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Hogan Courtyard Canopy Greenness (GCC)</h1>
    <p>Continuous monitoring of vegetation water stress and phenology.</p>
    
    <div class="dashboard-grid">
        <div class="image-card">
            <img id="phenocam-img" alt="Latest Midday Phenocam Image" onerror="this.src='https://via.placeholder.com/800x450?text=Waiting+for+first+midday+capture...'">
            <div class="caption">Latest Midday Capture (12:00 PM EST)</div>
        </div>

        <div class="plot-card">
            <div id="plot-div" style="width:100%; height:450px;"></div>
        </div>
    </div>
</div>

<script>
    // 1. Load the image with a cache-buster
    document.getElementById('phenocam-img').src = "latest_midday.jpg?t=" + new Date().getTime();

    // 2. Fetch and parse the CSV
    Papa.parse("phenocam_data.csv", {
        download: true,
        header: true,
        dynamicTyping: true,
        complete: function(results) {
            const data = results.data;
            const timestamps = data.map(row => row.timestamp).filter(t => t != null);
            const gccValues = data.map(row => row.gcc).filter(g => g != null);

            const trace = {
                x: timestamps,
                y: gccValues,
                mode: 'lines+markers',
                type: 'scatter',
                line: { shape: 'spline', color: '#2ca02c' },
                marker: { size: 4 }
            };

            const layout = {
                title: '30-Minute Interval GCC',
                xaxis: { title: 'Time' },
                yaxis: { title: 'GCC' },
                hovermode: 'x unified',
                margin: { l: 50, r: 20, t: 40, b: 40 }
            };

            Plotly.newPlot('plot-div', [trace], layout);
        }
    });
</script>

</body>
</html>
