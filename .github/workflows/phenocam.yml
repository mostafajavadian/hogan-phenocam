name: 30-Minute Phenocam Extraction

on:
  schedule:
    - cron: '0,30 * * * *' # Triggers at minute 0 and 30
  workflow_dispatch:

jobs:
  extract_gcc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install playwright opencv-python-headless numpy pandas pytz astral

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run Phenology Extraction Script
        run: python gcc_logger.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add phenocam_data.csv
          git add latest_image.jpg || true
          git commit -m "Automated Phenology update [skip ci]" || echo "No changes to commit"
          git push
