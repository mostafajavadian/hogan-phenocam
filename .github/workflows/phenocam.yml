name: 30-Minute Phenocam Extraction

on:
  schedule:
    - cron: '*/30 * * * *' # Triggers every 30 minutes
  workflow_dispatch: # Allows you to run it manually from the GitHub website

jobs:
  extract_gcc:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the bot to commit the CSV back to the repo
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install playwright opencv-python-headless numpy pandas

      - name: Install Python Dependencies
        run: pip install playwright opencv-python-headless numpy pandas pytz

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run GCC Extraction Script
        run: python gcc_logger.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add phenocam_data.csv
          git add latest_midday.jpg || true  # The "|| true" prevents a crash if it's not 12:00 PM yet
          git commit -m "Automated GCC and Image update [skip ci]" || echo "No changes to commit"
          git push
